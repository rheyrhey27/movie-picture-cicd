name: Backend Continuous Integration

on:
  pull_request:
    paths:
      - "starter/backend/**"

  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: starter/backend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Pipenv
        run: pip install pipenv

      - name: Install Dependencies
        run: pipenv install

      - name: Run Linter
        run: pipenv run lint

  test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: starter/backend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Pipenv
        run: pip install pipenv

      - name: Install Dependencies
        run: pipenv install

      - name: Run Tests
        run: pipenv run test

  build:
    runs-on: ubuntu-latest

  needs:
    - lint
    - test

  defaults:
    run:
      working-directory: starter/backend

  steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Build Docker Image
      run: docker build -t backend .